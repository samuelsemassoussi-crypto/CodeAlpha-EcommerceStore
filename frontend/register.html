<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Inscription — CodeAlpha Ecommerce Store</title>
<link rel="stylesheet" href="css/style.css" />
  <link rel="icon" type="image/png" href="frontend/images/favicon.png">
</head>
<body>

<header class="navbar">
  <div class="container navbar-inner">
    <a href="index.html" class="logo">CodeAlpha<span>Store</span></a>
  </div>
</header>

<main class="auth-page">
  <div class="auth-card">
    <h1>Créer un compte ✨</h1>
    <p class="subtitle">Rejoignez CodeAlpha Store en quelques secondes</p>

    <form id="registerForm" class="auth-form">
      <label>Nom complet</label>
      <input type="text" id="registerName" required />
      <label>Email</label>
      <input type="email" id="registerEmail" required />
      <label>Mot de passe</label>
      <input type="password" id="registerPassword" required minlength="6" />
      <button type="submit" class="btn btn-primary btn-block">Créer mon compte</button>
      <p class="auth-error" id="registerError"></p>
    </form>

    <p class="auth-switch">Déjà inscrit ? <a href="login.html">Se connecter</a></p>
  </div>
</main>

<script src="js/common.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
